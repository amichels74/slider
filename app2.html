<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vôlei Master</title>
<style>
/* ── TOKENS ─────────────────────────────────── */
:root {
  --blue:    #1d4ed8; --blue-lt: #dbeafe; --blue-md: #3b82f6;
  --green:   #15803d; --green-lt:#dcfce7;
  --amber:   #b45309; --amber-lt:#fef3c7;
  --red:     #b91c1c; --red-lt:  #fee2e2;
  --gray-50: #f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-400:#9ca3af; --gray-600:#4b5563; --gray-800:#1f2937;
  --white:   #ffffff;
  --shadow:  0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --radius:  10px; --radius-lg: 16px;
  --sidebar: 220px;
}

/* ── RESET ───────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--gray-800);background:var(--gray-50);display:flex;min-height:100vh;}

/* ── SIDEBAR ─────────────────────────────────── */
#sidebar{width:var(--sidebar);background:var(--white);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .2s;}
.sidebar-logo{padding:20px 18px 14px;border-bottom:1px solid var(--gray-200);}
.sidebar-logo .app-title{font-size:15px;font-weight:700;color:var(--blue);}
.sidebar-logo .app-sub{font-size:11px;color:var(--gray-400);margin-top:2px;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--gray-600);font-size:13.5px;font-weight:500;text-decoration:none;margin-bottom:2px;transition:background .15s,color .15s;}
.nav-item:hover{background:var(--gray-100);}
.nav-item.active{background:var(--blue-lt);color:var(--blue);}
.nav-item .nav-ico{font-size:17px;width:20px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--gray-200);font-size:11px;color:var(--gray-400);}

/* ── MAIN ────────────────────────────────────── */
#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:15px;font-weight:700;color:var(--gray-800);}
.topbar-right{display:flex;align-items:center;gap:10px;}
#content{flex:1;padding:24px;max-width:1200px;}

/* ── PÁGINAS ─────────────────────────────────── */
.page{display:none;}
.page.active{display:block;}

/* ── CARDS / CONTAINERS ──────────────────────── */
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow);}
.card-sm{padding:14px 16px;}
.section-title{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}

/* ── GRID ────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

/* ── STAT TILE ───────────────────────────────── */
.stat{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);}
.stat .lbl{font-size:11px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.stat .val{font-size:26px;font-weight:700;margin-top:4px;line-height:1;}
.stat .sub{font-size:12px;color:var(--gray-400);margin-top:4px;}

/* ── BADGES ──────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.6;}
.badge-blue  {background:var(--blue-lt);color:var(--blue);}
.badge-amber {background:var(--amber-lt);color:var(--amber);}
.badge-green {background:var(--green-lt);color:var(--green);}
.badge-red   {background:var(--red-lt);color:var(--red);}
.badge-gray  {background:var(--gray-100);color:var(--gray-600);}

/* ── BOTÕES ──────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-700);transition:all .15s;}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--blue);color:var(--white);border-color:var(--blue);}
.btn-primary:hover{background:#1e40af;border-color:#1e40af;}
.btn-danger{background:var(--red-lt);color:var(--red);border-color:#fca5a5;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 12px;font-size:12.5px;}
.btn-lg{padding:12px 24px;font-size:15px;border-radius:10px;}
.btn-full{width:100%;}

/* ── INPUTS ──────────────────────────────────── */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:14px;color:var(--gray-800);background:var(--white);outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-md);}
.fields-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── LISTA DE JOGOS ──────────────────────────── */
.jogo-card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.jogo-card:hover{border-color:var(--blue-md);box-shadow:var(--shadow-md);}
.jogo-card.selected{border-color:var(--blue);background:var(--blue-lt);}
.jogo-card .jc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.jogo-card .jc-camp{font-size:13.5px;font-weight:700;}
.jogo-card .jc-data{font-size:12px;color:var(--gray-400);margin-top:2px;}
.jogo-card .jc-custo{font-size:14px;font-weight:700;color:var(--blue);text-align:right;}
.jogo-card .jc-info{font-size:11px;color:var(--gray-400);text-align:right;margin-top:2px;}

/* ── ATHLETE ROW ─────────────────────────────── */
.atleta-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .12s;}
.atleta-row:hover{background:var(--gray-50);}
.atleta-row.checked{background:var(--blue-lt);}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.atleta-row .ar-info{flex:1;min-width:0;}
.atleta-row .ar-nome{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.atleta-row .ar-tipo{font-size:11px;color:var(--gray-400);margin-top:1px;}
.chk-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--gray-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .12s;}
.chk-box.on{background:var(--blue);border-color:var(--blue);color:white;}

/* ── TABLE ───────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;padding:9px 12px;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--gray-200);background:var(--gray-50);}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--gray-100);font-size:13.5px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--gray-50);}

/* ── TWO-COLUMN JOGOS ────────────────────────── */
#jogos-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;}
#jogos-left{}
#jogos-right{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);min-height:400px;box-shadow:var(--shadow);}
.jogos-right-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;color:var(--gray-400);}
.jogos-right-empty .big-ico{font-size:48px;margin-bottom:12px;}
.jogos-right-empty .big-txt{font-size:14px;}

/* ── FORM PANEL ──────────────────────────────── */
.form-panel{padding:24px;}
.form-panel-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.form-panel-sub{font-size:12px;color:var(--gray-400);margin-bottom:20px;}
.form-section{border:1.5px solid var(--gray-200);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.form-section-header{padding:10px 14px;background:var(--gray-50);border-bottom:1.5px solid var(--gray-200);font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.06em;}
.form-section-body{padding:14px 16px;}
.form-actions{display:flex;gap:10px;margin-top:20px;}

/* ── TOGGLE SWITCH ───────────────────────────── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--amber-lt);border-radius:10px;margin-bottom:12px;}
.toggle-row .tr-label{font-size:13.5px;font-weight:700;color:var(--amber);}
.toggle-row .tr-sub{font-size:11px;color:#92400e;margin-top:1px;}
.sw{position:relative;width:44px;height:24px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw-slider{position:absolute;inset:0;background:var(--gray-200);border-radius:24px;cursor:pointer;transition:.2s;}
.sw-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
.sw input:checked + .sw-slider{background:var(--amber);}
.sw input:checked + .sw-slider:before{transform:translateX(20px);}

/* ── ALERT BOX ───────────────────────────────── */
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;}
.alert-blue{background:var(--blue-lt);color:#1e3a8a;border:1px solid #bfdbfe;}
.alert-amber{background:var(--amber-lt);color:#78350f;border:1px solid #fcd34d;}

/* ── COBRANÇA ATLETA ─────────────────────────── */
.cob-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--gray-100);}
.cob-row:last-child{border-bottom:none;}
.cob-row .cr-nome{flex:1;font-size:13.5px;font-weight:500;}
.cob-row .cr-tipo{width:100px;}
.cob-row .cr-val{width:90px;text-align:right;font-weight:700;color:var(--gray-800);}
.cob-row .cr-status{width:90px;text-align:right;}

/* ── MODAL ───────────────────────────────────── */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}

/* ── LOADING ─────────────────────────────────── */
.loading{padding:32px;text-align:center;color:var(--gray-400);font-size:13px;}
.spinner{width:24px;height:24px;border:3px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MONTH SELECTOR ──────────────────────────── */
.month-sel{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.month-sel select{flex:1;padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:14px;font-weight:600;color:var(--gray-800);background:var(--white);cursor:pointer;}

/* ── MOBILE ──────────────────────────────────── */
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-200);z-index:100;padding:6px 0 max(6px, env(safe-area-inset-bottom));}
.mob-tabs{display:flex;}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--gray-400);font-size:10px;font-weight:600;}
.mob-tab .mi{font-size:20px;}
.mob-tab.active{color:var(--blue);}
#mob-ham{display:none;background:none;border:none;padding:10px;cursor:pointer;font-size:22px;}

@media(max-width:768px){
  #sidebar{transform:translateX(-100%);box-shadow:none;}
  #sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.35);}
  #main{margin-left:0;}
  #content{padding:14px 14px 80px;}
  #jogos-layout{grid-template-columns:1fr;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  #mob-nav{display:block;}
  #mob-ham{display:block;}
  .fields-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <div class="app-title">🏐 Vôlei Master</div>
    <div class="app-sub">Gestão de cobranças</div>
  </div>
  <div class="sidebar-nav">
    <a class="nav-item active" onclick="navTo('dash')"><span class="nav-ico">🏠</span>Início</a>
    <a class="nav-item" onclick="navTo('jogos')"><span class="nav-ico">📅</span>Jogos</a>
    <a class="nav-item" onclick="navTo('fechamento')"><span class="nav-ico">💰</span>Cobranças</a>
    <a class="nav-item" onclick="navTo('atletas')"><span class="nav-ico">👥</span>Atletas</a>
    <a class="nav-item" onclick="navTo('campeonatos')"><span class="nav-ico">🏆</span>Campeonatos</a>
  </div>
  <div class="sidebar-footer">v2 · Novo design</div>
</nav>

<!-- MAIN -->
<div id="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="mob-ham" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title" id="topbar-title">Início</span>
    </div>
    <div class="topbar-right">
      <span id="topbar-mes" style="font-size:13px;color:var(--gray-400);font-weight:600;"></span>
    </div>
  </header>

  <div id="content">

    <!-- ── DASHBOARD ── -->
    <div id="page-dash" class="page active">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>

    <!-- ── JOGOS ── -->
    <div id="page-jogos" class="page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="month-sel" style="margin:0;flex:1;max-width:220px;">
          <select id="j2-mes" onchange="carregarJogos()"></select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="abrirNovoJogo()">+ Novo jogo</button>
      </div>
      <div id="jogos-layout">
        <div id="jogos-left">
          <div id="jogos-lista"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
        </div>
        <div id="jogos-right">
          <div class="jogos-right-empty" id="jogos-right-empty">
            <div class="big-ico">📅</div>
            <div class="big-txt">Selecione um jogo ou crie um novo</div>
          </div>
          <div id="jogos-right-content" style="display:none;"></div>
        </div>
      </div>
    </div>

    <!-- ── FECHAMENTO ── -->
    <div id="page-fechamento" class="page">
      <div class="month-sel">
        <select id="fech2-mes" onchange="carregarFechamento2()"></select>
      </div>
      <div id="fech2-content"><div class="loading"><div class="spinner"></div>Calculando...</div></div>
    </div>

    <!-- ── ATLETAS ── -->
    <div id="page-atletas" class="page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm active-filter" id="atf-todas" onclick="filtroAtleta('todas')">Todas</button>
          <button class="btn btn-sm" id="atf-mensalistas" onclick="filtroAtleta('mensalistas')">Mensalistas</button>
          <button class="btn btn-sm" id="atf-avulsas" onclick="filtroAtleta('avulsas')">Avulsas</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="abrirNovaAtleta()">+ Nova atleta</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div id="atletas-content"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
      </div>
    </div>

    <!-- ── CAMPEONATOS ── -->
    <div id="page-campeonatos" class="page">
      <div id="camp2-content"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<!-- MOBILE BOTTOM NAV -->
<nav id="mob-nav">
  <div class="mob-tabs">
    <div class="mob-tab active" id="mt-dash" onclick="navTo('dash')"><span class="mi">🏠</span>Início</div>
    <div class="mob-tab" id="mt-jogos" onclick="navTo('jogos')"><span class="mi">📅</span>Jogos</div>
    <div class="mob-tab" id="mt-fechamento" onclick="navTo('fechamento')"><span class="mi">💰</span>Cobranças</div>
    <div class="mob-tab" id="mt-atletas" onclick="navTo('atletas')"><span class="mi">👥</span>Atletas</div>
    <div class="mob-tab" id="mt-campeonatos" onclick="navTo('campeonatos')"><span class="mi">🏆</span>Camps.</div>
  </div>
</nav>

<!-- MODAL -->
<div id="modal-bg" onclick="fecharModal(event)">
  <div class="modal" id="modal-box">
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────
const API = 'api/';
let currentPage = 'dash';
let todosAtletas = [];
let todosCampeonatos = [];
let atletaFiltro = 'todas';
let mesFerias2 = false;
let selPresencas = new Set();
let editPresencas = null;

// ── UTILS ─────────────────────────────────────
function R(n) {
  const v = parseFloat(n)||0;
  const f = v % 1 === 0 ? 2 : (Math.round(v*1000)%10 !== 0 ? 3 : 2);
  return 'R$ '+v.toFixed(f).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function fmtData(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function fmtMesLabel(m) {
  if (!m) return '';
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [y,mo] = m.split('-');
  return nomes[parseInt(mo)-1]+'/'+y;
}
function ini(nome) {
  return nome.trim().split(' ').slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');
}
function corAtleta(tipo) {
  if (tipo==='avulsa')     return {bg:'#fef3c7',color:'#b45309'};
  if (tipo==='mensalista') return {bg:'#dbeafe',color:'#1d4ed8'};
  return {bg:'#f3f4f6',color:'#4b5563'};
}

async function api(path, method='GET', body=null) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API+path, opts);
  return r.json().catch(()=>null);
}

function vAlert(msg) { return new Promise(res => { alert(msg); res(); }); }
function vConfirm(msg) { return Promise.resolve(confirm(msg)); }

// ── MESES ─────────────────────────────────────
function gerarMeses(selId, onchange) {
  const sel = document.getElementById(selId);
  const now = new Date();
  const opts = [];
  for (let i = 0; i < 18; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    opts.push(`<option value="${val}">${fmtMesLabel(val)}</option>`);
  }
  sel.innerHTML = opts.join('');
  if (onchange) sel.addEventListener('change', onchange);
}

// ── NAVEGAÇÃO ─────────────────────────────────
const PAGE_TITLES = {dash:'Início',jogos:'Jogos',fechamento:'Cobranças',atletas:'Atletas',campeonatos:'Campeonatos'};

function navTo(page) {
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.mob-tab').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));

  const navEl = document.querySelector(`.nav-item[onclick="navTo('${page}')"]`);
  if (navEl) navEl.classList.add('active');
  const mobEl = document.getElementById('mt-'+page);
  if (mobEl) mobEl.classList.add('active');
  const pageEl = document.getElementById('page-'+page);
  if (pageEl) pageEl.classList.add('active');

  document.getElementById('topbar-title').textContent = PAGE_TITLES[page]||'';
  currentPage = page;

  // fecha sidebar mobile ao navegar
  document.getElementById('sidebar').classList.remove('open');

  if (page==='dash')       renderDash();
  if (page==='jogos')      initJogos();
  if (page==='fechamento') initFechamento();
  if (page==='atletas')    carregarAtletas2();

}

async function renderDash() {
  const el = document.getElementById('page-dash');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  const mes = new Date().toISOString().slice(0,7);
  document.getElementById('topbar-mes').textContent = fmtMesLabel(mes);

  const [jogos, preview, atletas] = await Promise.all([
    api('jogos.php?mes='+mes),
    api('fechamento.php?mes='+mes),
    api('atletas.php'),
  ]);

  const nJogos = jogos?.length || 0;
  const camps  = [...new Set((jogos||[]).map(j=>j.camp_nome))];

  let totalPend = 0, totalPago = 0, nPend = 0;
  if (preview) {
    for (const camp of Object.values(preview)) {
      totalPend += parseFloat(camp.total_pendente||0);
      totalPago += parseFloat(camp.total_pago||0);
      nPend += parseInt(camp.n_pendente||0);
    }
  }

  const nAtletas = (atletas||[]).filter(a=>a.inscricoes?.some(i=>i.status==='ativa')).length;

  el.innerHTML = `
  <div class="grid-4" style="margin-bottom:20px;">
    <div class="stat"><div class="lbl">Pendente ${fmtMesLabel(mes)}</div><div class="val" style="color:var(--red)">${R(totalPend)}</div><div class="sub">${nPend} atleta(s)</div></div>
    <div class="stat"><div class="lbl">Recebido ${fmtMesLabel(mes)}</div><div class="val" style="color:var(--green)">${R(totalPago)}</div></div>
    <div class="stat"><div class="lbl">Jogos no mês</div><div class="val" style="color:var(--blue)">${nJogos}</div><div class="sub">${camps.slice(0,2).join(', ')}</div></div>
    <div class="stat"><div class="lbl">Atletas ativas</div><div class="val">${nAtletas}</div></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="section-title">Ações rápidas</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-full" onclick="navTo('jogos');setTimeout(abrirNovoJogo,100)">📅 Registrar jogo</button>
        <button class="btn btn-full" onclick="navTo('fechamento')">💰 Ver cobranças do mês</button>
        <button class="btn btn-full" onclick="navTo('atletas')">👥 Gerenciar atletas</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Últimos jogos</div>
      ${nJogos===0 ? '<p style="color:var(--gray-400);font-size:13px;">Nenhum jogo em '+fmtMesLabel(mes)+'</p>' :
        (jogos||[]).slice(0,4).map(j=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
            <div>
              <div style="font-size:13.5px;font-weight:600;">${j.camp_nome} ${j.mes_ferias?'🏖️':''}</div>
              <div style="font-size:12px;color:var(--gray-400);">${fmtData(j.data_jogo)}</div>
            </div>
            <div style="font-weight:700;color:var(--blue);">${R(j.custo_total)}</div>
          </div>`).join('')
      }
    </div>
  </div>`;
}

function initJogos() {
  gerarMeses('j2-mes');

async function carregarJogos() {
  const mes = document.getElementById('j2-mes').value;
  document.getElementById('topbar-mes').textContent = fmtMesLabel(mes);
  const lista = document.getElementById('jogos-lista');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  const jogos = await api('jogos.php?mes='+mes) || [];

  if (!jogos.length) {
    lista.innerHTML = '<div style="padding:24px;text-align:center;color:var(--gray-400);">Nenhum jogo em '+fmtMesLabel(mes)+'</div>';
    return;
  }

  lista.innerHTML = jogos.map(j => {
    const nPres = j.mes_ferias ? (j.presencas||[]).length : (j.avulsas||[]).length;
    return `<div class="jogo-card" id="jcard-${j.id}" onclick="verJogo2('${j.id}')">
      <div class="jc-top">
        <div>
          <div class="jc-camp">${j.camp_nome} ${j.mes_ferias?'<span class="badge badge-amber">🏖️ Férias</span>':''}</div>
          <div class="jc-data">${fmtData(j.data_jogo)}${j.observacoes?' · '+j.observacoes:''}</div>
        </div>
        <div>
          <div class="jc-custo">${R(j.custo_total)}</div>
          <div class="jc-info">${j.mes_ferias ? nPres+' presente(s)' : nPres+' avulsa(s)'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function verJogo2(id) {
  document.querySelectorAll('.jogo-card').forEach(c=>c.classList.remove('selected'));
  const card = document.getElementById('jcard-'+id);
  if (card) card.classList.add('selected');

  const right = document.getElementById('jogos-right');
  const empty = document.getElementById('jogos-right-empty');
  const content = document.getElementById('jogos-right-content');

  if (empty) empty.style.display = 'none';
  content.style.display = 'block';
  content.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';

  const mes = document.getElementById('j2-mes').value;
  const jogos = await api('jogos.php?mes='+mes) || [];
  const j = jogos.find(x=>x.id===id);
  if (!j) { content.innerHTML = '<p style="padding:20px;color:var(--gray-400);">Jogo não encontrado.</p>'; return; }

  // Carrega atletas do campeonato
  const todasAtl = await api('atletas.php') || [];
  const atletasDoJogo = [];
  const seenIds = new Set();
  todasAtl.forEach(a => {
    if (seenIds.has(a.id)) return;
    const insc = (a.inscricoes||[]).find(i => String(i.campeonato_id)===String(j.campeonato_id));
    if (!insc) return;
    seenIds.add(a.id);
    atletasDoJogo.push({...a, tipo:insc.tipo, status:insc.status});
  });
  atletasDoJogo.sort((a,b)=>a.nome.localeCompare(b.nome));

  const isFer = !!j.mes_ferias;
  const presIds = new Set(((isFer ? j.presencas : j.avulsas)||[]).map(p=>String(p.atleta_id||p.id||'')));
  editPresencas = new Set([...presIds]);

  // Separa atletas: para férias mostra todos; para normal só avulsa+ausente
  const paraExibir = isFer
    ? atletasDoJogo.filter(a=>a.status==='ativa'||a.status==='ausente')
    : atletasDoJogo.filter(a=>(a.tipo==='avulsa'||a.status==='ausente')&&(a.status==='ativa'||a.status==='ausente'));

  const mensalistas = isFer ? [] : atletasDoJogo.filter(a=>a.tipo==='mensalista'&&(a.status==='ativa'||a.status==='ausente'));

  content.innerHTML = `
  <div class="form-panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
      <div>
        <div class="form-panel-title">✏️ Editar Jogo</div>
        <div class="form-panel-sub">${j.camp_nome} · ${fmtData(j.data_jogo)}</div>
      </div>
      <button class="btn btn-sm" onclick="fecharPainelJogo()">✕</button>
    </div>
    ${isFer ? '<div class="alert alert-amber">🏖️ <strong>Mês de Férias</strong> — marque todos que foram ao jogo. O custo será dividido entre eles.</div>' : ''}

    <div class="form-section">
      <div class="form-section-header">Dados do jogo</div>
      <div class="form-section-body">
        <div class="fields-row">
          <div class="field"><label>Data</label><input type="date" id="ej2-data" value="${j.data_jogo}"></div>
          <div class="field"><label>Custo jogo (R$)</label><input type="number" id="ej2-custo" value="${j.custo_jogo}" step="0.5"></div>
        </div>
        <div class="fields-row">
          <div class="field"><label>Técnico (R$)</label><input type="number" id="ej2-tecnico" value="${j.custo_tecnico}" step="0.5"></div>
          <div class="field"><label>Valor avulsa (R$)</label><input type="number" id="ej2-avulsa" value="${j.valor_avulsa}" step="0.5"></div>
        </div>
        <div class="field"><label>Observações</label><input type="text" id="ej2-obs" value="${j.observacoes||''}" placeholder="Opcional"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-header">
        ${isFer ? '🏖️ Quem foi ao jogo de férias?' : '⚡ Avulsas presentes'}
        <span style="float:right;font-size:11px;color:var(--gray-400);" id="ej2-count">${presIds.size} selecionado(s)</span>
      </div>
      <div id="ej2-lista" style="max-height:320px;overflow-y:auto;">
        ${renderAtletasSelect(paraExibir, editPresencas, 'toggleEditPresenca')}
      </div>
      ${!isFer && mensalistas.length ? `
      <div style="border-top:1.5px solid var(--gray-200);">
        <button onclick="toggleMensalistasCollapse()" style="width:100%;text-align:left;padding:10px 14px;background:var(--gray-50);border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--gray-500);display:flex;justify-content:space-between;" id="btn-mens-col">
          <span>👥 Mensalistas do campeonato (${mensalistas.length})</span>
          <span id="mens-col-arrow">▾</span>
        </button>
        <div id="mens-col-body" style="display:none;">
          ${mensalistas.map(a=>{
            const c = corAtleta(a.tipo);
            const afst = a.status==='ausente' ? ' <span class="badge badge-amber" style="font-size:10px;">afastada</span>' : '';
            return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--gray-100);">
              <div class="av" style="background:${c.bg};color:${c.color};">${ini(a.nome)}</div>
              <div style="flex:1;font-size:13.5px;">${a.nome}${afst}</div>
              <span class="badge badge-blue">mensalista</span>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" style="flex:1;" onclick="salvarEdicaoJogo2('${j.id}','${j.campeonato_id}',${isFer})">💾 Salvar alterações</button>
      <button class="btn btn-danger" onclick="excluirJogo2('${j.id}')">🗑️</button>
    </div>
  </div>`;
}

function renderAtletasSelect(lista, selected, fnToggle) {
  if (!lista.length) return '<p style="padding:14px;color:var(--gray-400);font-size:13px;">Nenhuma atleta disponível.</p>';
  return lista.map(a => {
    const c = corAtleta(a.tipo);
    const ck = selected.has(String(a.id));
    const afst = a.status==='ausente' ? ' <span class="badge badge-amber" style="font-size:10px;">afastada</span>' : '';
    const tipoLabel = a.tipo==='avulsa'?'avulsa':a.tipo==='mensalista'?'mensalista':'—';
    return `<div class="atleta-row ${ck?'checked':''}" id="ar-${a.id}" onclick="${fnToggle}('${a.id}')">
      <div class="av" style="background:${c.bg};color:${c.color};">${ini(a.nome)}</div>
      <div class="ar-info">
        <div class="ar-nome">${a.nome}${afst}</div>
        <div class="ar-tipo">${tipoLabel}</div>
      </div>
      <div class="chk-box ${ck?'on':''}" id="chk2-${a.id}">${ck?'✓':''}</div>
    </div>`;
  }).join('');
}

function toggleEditPresenca(id) {
  id = String(id);
  if (!editPresencas) editPresencas = new Set();
  if (editPresencas.has(id)) editPresencas.delete(id); else editPresencas.add(id);
  const row = document.getElementById('ar-'+id);
  const chk = document.getElementById('chk2-'+id);
  if (row) row.className = 'atleta-row'+(editPresencas.has(id)?' checked':'');
  if (chk) { chk.className='chk-box'+(editPresencas.has(id)?' on':''); chk.textContent=editPresencas.has(id)?'✓':''; }
  const cnt = document.getElementById('ej2-count');
  if (cnt) cnt.textContent = editPresencas.size+' selecionado(s)';
}

function toggleMensalistasCollapse() {
  const body = document.getElementById('mens-col-body');
  const arrow = document.getElementById('mens-col-arrow');
  const open = body.style.display==='block';
  body.style.display = open ? 'none' : 'block';
  if (arrow) arrow.textContent = open ? '▾' : '▴';
}

async function salvarEdicaoJogo2(jogoId, campId, isFer) {
  const data    = document.getElementById('ej2-data').value;
  const custo   = parseFloat(document.getElementById('ej2-custo').value)||0;
  const tecnico = parseFloat(document.getElementById('ej2-tecnico').value)||0;
  const avulsa  = parseFloat(document.getElementById('ej2-avulsa').value)||55;
  const obs     = document.getElementById('ej2-obs').value;
  if (!data) { await vAlert('Informe a data'); return; }
  const ids = [...(editPresencas||[])];
  const payload = {
    id:jogoId, campeonato_id:campId, data_jogo:data,
    custo_jogo:custo, custo_tecnico:tecnico, valor_avulsa:avulsa, observacoes:obs,
    mes_ferias: isFer ? 1 : 0,
    avulsas_ids: isFer ? [] : ids,
    presencas_ids: isFer ? ids : []
  };
  const res = await api('jogos.php','PUT',payload);
  if (res?.ok) { await carregarJogos(); verJogo2(jogoId); }
  else await vAlert('Erro ao salvar: '+(res?.erro||''));
}

async function excluirJogo2(id) {
  if (!await vConfirm('Excluir este jogo? Não pode ser desfeito.')) return;
  const res = await api('jogos.php?id='+id,'DELETE');
  if (res?.ok) { fecharPainelJogo(); carregarJogos(); }
  else await vAlert('Erro ao excluir.');
}

function fecharPainelJogo() {
  document.querySelectorAll('.jogo-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('jogos-right-empty').style.display = 'flex';
  document.getElementById('jogos-right-content').style.display = 'none';
  editPresencas = null;
}

  else await vAlert('Erro ao salvar: '+(res?.erro||''));
}

// ── FECHAMENTO ────────────────────────────────
function initFechamento() {
  gerarMeses('fech2-mes');
  carregarFechamento2();
}

async function carregarFechamento2() {
  const mes = document.getElementById('fech2-mes').value;
  document.getElementById('topbar-mes').textContent = fmtMesLabel(mes);
  const el = document.getElementById('fech2-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Calculando...</div>';
  const preview = await api('fechamento.php?mes='+mes);
  if (!preview || !Object.keys(preview).length) {
    el.innerHTML = '<p style="color:var(--gray-400);padding:20px;">Nenhum dado para '+fmtMesLabel(mes)+'.</p>';
    return;
  }

  let html = '';
  for (const [campId, camp] of Object.entries(preview)) {
    const cobrs = camp.cobranças || camp.cobrancas || [];
    const totalPend = parseFloat(camp.total_pendente||0);
    const totalPago = parseFloat(camp.total_pago||0);

    html += `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:16px;font-weight:700;">🏆 ${camp.nome||campId}</div>
        <button class="btn btn-sm btn-primary" onclick="fecharMes2('${campId}','${mes}')">Fechar mês</button>
      </div>
      ${camp.resumo ? `<div class="alert alert-blue" style="margin-bottom:12px;">${camp.resumo}</div>` : ''}
      <div class="grid-2" style="margin-bottom:14px;">
        <div style="background:var(--red-lt);border-radius:8px;padding:12px 14px;text-align:center;">
          <div style="font-size:11px;color:var(--red);font-weight:700;text-transform:uppercase;">Pendente</div>
          <div style="font-size:22px;font-weight:700;color:var(--red);">${R(totalPend)}</div>
        </div>
        <div style="background:var(--green-lt);border-radius:8px;padding:12px 14px;text-align:center;">
          <div style="font-size:11px;color:var(--green);font-weight:700;text-transform:uppercase;">Recebido</div>
          <div style="font-size:22px;font-weight:700;color:var(--green);">${R(totalPago)}</div>
        </div>
      </div>
      <table class="tbl">
        <thead><tr><th>Atleta</th><th>Tipo</th><th>Valor</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${cobrs.map(c=>`
          <tr>
            <td><strong>${c.nome}</strong></td>
            <td><span class="badge ${c.tipo==='avulsa'?'badge-amber':c.tipo==='ferias'||c.tipo==='Férias'?'badge-amber':'badge-blue'}">${c.tipo}</span></td>
            <td><strong>${R(c.valor)}</strong></td>
            <td><span class="badge ${c.pago?'badge-green':'badge-red'}">${c.pago?'✅ Pago':'❌ Pendente'}</span></td>
            <td style="text-align:right;">
              ${c.fechamento_id ? `<button class="btn btn-sm" onclick="togglePago2('${c.fechamento_id}',${c.pago?0:1})">${c.pago?'Desfazer':'Marcar pago'}</button>` : ''}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }
  el.innerHTML = html || '<p style="color:var(--gray-400);padding:20px;">Nenhuma cobrança.</p>';
}

async function fecharMes2(campId, mes) {
  if (!await vConfirm('Gerar cobranças para '+fmtMesLabel(mes)+'?\nIsso recalcula os valores com base nos jogos do mês.')) return;
  const res = await api('fechamento.php','POST',{campeonato_id:campId, mes_referencia:mes});
  if (res?.ok) carregarFechamento2();
  else await vAlert('Erro: '+(res?.erro||JSON.stringify(res)));
}

async function togglePago2(fechId, pago) {
  const res = await api('fechamento.php','PUT',{id:fechId, pago});
  if (res?.ok) carregarFechamento2();
}

// ── ATLETAS ───────────────────────────────────
async function carregarAtletas2() {
  document.getElementById('topbar-mes').textContent = '';
  const el = document.getElementById('atletas-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  todosAtletas = await api('atletas.php') || [];
  renderAtletasTabela();
}

function filtroAtleta(f) {
  atletaFiltro = f;
  document.querySelectorAll('[id^="atf-"]').forEach(b=>b.classList.remove('active-filter','btn-primary'));
  const active = document.getElementById('atf-'+f);
  if (active) active.classList.add('active-filter','btn-primary');
  renderAtletasTabela();
}

function renderAtletasTabela() {
  const el = document.getElementById('atletas-content');
  let lista = todosAtletas;
  if (atletaFiltro==='mensalistas') lista = lista.filter(a=>a.inscricoes?.some(i=>i.tipo==='mensalista'&&i.status==='ativa'));
  if (atletaFiltro==='avulsas')     lista = lista.filter(a=>a.inscricoes?.some(i=>i.tipo==='avulsa'&&i.status==='ativa'));

  if (!lista.length) {
    el.innerHTML = '<p style="padding:24px;color:var(--gray-400);">Nenhuma atleta encontrada.</p>';
    return;
  }

  el.innerHTML = `<table class="tbl">
    <thead><tr><th>Atleta</th><th>Posição</th><th>Inscrições</th><th>Status</th><th></th></tr></thead>
    <tbody>
    ${lista.map(a=>{
      const insc = a.inscricoes||[];
      const badges = insc.map(i=>{
        const c = corAtleta(i.tipo);
        const st = i.status==='ausente'?' <span class="badge badge-amber">afastada</span>':i.status==='inativa'?' <span class="badge badge-gray">inativa</span>':'';
        return `<span class="badge" style="background:${c.bg};color:${c.color};margin-right:3px;">${i.camp_nome||i.campeonato_id}</span>${st}`;
      }).join('');
      return `<tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="av" style="background:var(--blue-lt);color:var(--blue);">${ini(a.nome)}</div>
            <strong>${a.nome}</strong>
          </div>
        </td>
        <td><span class="badge badge-gray">${a.posicao||'—'}</span></td>
        <td>${badges||'<span style="color:var(--gray-400);">—</span>'}</td>
        <td>${insc.some(i=>i.status==='ausente')?'<span class="badge badge-amber">⚠️ Afastada</span>':insc.some(i=>i.status==='ativa')?'<span class="badge badge-green">Ativa</span>':'<span class="badge badge-gray">—</span>'}</td>
        <td style="text-align:right;"><button class="btn btn-sm" onclick="verAtleta2('${a.id}')">Ver / Editar</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

async function verAtleta2(id) {
  const a = todosAtletas.find(x=>x.id===id);
  if (!a) return;
  if (!todosCampeonatos.length) todosCampeonatos = await api('campeonatos.php') || [];
  const insc = a.inscricoes||[];

  abrirModal(`
    <div class="modal-title">👤 ${a.nome}</div>
    <p style="font-size:13px;color:var(--gray-400);margin-bottom:16px;">${a.posicao||'Indefinido'} · ID: ${a.id}</p>

    <div class="section-title">Inscrições e status</div>
    ${insc.map(i=>{
      const c = corAtleta(i.tipo);
      const stBadge = i.status==='ativa'?'badge-green':i.status==='ausente'?'badge-amber':'badge-gray';
      return `<div class="card card-sm" style="margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:14px;font-weight:700;">${i.camp_nome||i.campeonato_id}</span>
          <span class="badge" style="background:${c.bg};color:${c.color};">${i.tipo}</span>
          <span class="badge ${stBadge}">${i.status}</span>
        </div>
        <div class="fields-row" style="gap:8px;">
          <div>
            <label style="font-size:11px;color:var(--gray-500);font-weight:700;">Forma de cobrança</label>
            <select onchange="alterarTipoAtleta('${a.id}','${i.campeonato_id}',this.value)" style="width:100%;margin-top:4px;padding:6px 8px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:13px;">
              <option value="mensalista" ${i.tipo==='mensalista'?'selected':''}>Mensalista</option>
              <option value="avulsa" ${i.tipo==='avulsa'?'selected':''}>Avulsa</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:var(--gray-500);font-weight:700;">Situação</label>
            <select onchange="alterarStatusAtleta('${a.id}','${i.campeonato_id}',this.value)" style="width:100%;margin-top:4px;padding:6px 8px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:13px;">
              <option value="ativa" ${i.status==='ativa'?'selected':''}>Ativa</option>
              <option value="ausente" ${i.status==='ausente'?'selected':''}>Afastada</option>
              <option value="inativa" ${i.status==='inativa'?'selected':''}>Inativa</option>
            </select>
          </div>
        </div>
      </div>`;
    }).join('')}

    <div class="modal-actions">
      <button class="btn btn-full" onclick="fecharModal(true)">Fechar</button>
      <button class="btn btn-danger" onclick="excluirAtleta2('${a.id}')">🗑️ Excluir</button>
    </div>
  `);
}

async function alterarTipoAtleta(atletaId, campId, tipoNovo) {
  const mes = new Date().toISOString().slice(0,7);
  await api('atletas.php','PUT',{atleta_id:atletaId, campeonato_id:campId, tipo_novo:tipoNovo, mes_vigencia:mes});
  todosAtletas = await api('atletas.php') || [];
}

async function alterarStatusAtleta(atletaId, campId, status) {
  const desde = new Date().toISOString().slice(0,10);
  await api('atletas.php','PUT',{atleta_id:atletaId, campeonato_id:campId, status, status_desde:desde});
  todosAtletas = await api('atletas.php') || [];
  renderAtletasTabela();
}

async function excluirAtleta2(id) {
  if (!await vConfirm('Excluir atleta permanentemente? O histórico de cobranças é mantido.')) return;
  const res = await api('atletas.php','DELETE',{atleta_id:id});
  if (res?.ok) { fecharModal(true); carregarAtletas2(); }
  else await vAlert('Erro: '+(res?.erro||''));
}

function abrirNovaAtleta() {
  if (!todosCampeonatos.length) api('campeonatos.php').then(d=>{todosCampeonatos=d||[];abrirNovaAtleta();});
  abrirModal(`
    <div class="modal-title">➕ Nova Atleta</div>
    <div class="field"><label>Nome completo</label><input type="text" id="na-nome" placeholder="Nome da atleta"></div>
    <div class="fields-row">
      <div class="field"><label>Posição</label>
        <select id="na-pos">
          <option>Indefinido</option><option>Levantador</option><option>Central</option><option>Ponteiro</option><option>Oposto</option><option>Libero</option>
        </select>
      </div>
      <div class="field"><label>Telefone</label><input type="text" id="na-tel" placeholder="Opcional"></div>
    </div>
    <div class="section-title" style="margin-top:8px;">Inscrever em</div>
    ${(todosCampeonatos||[]).filter(c=>c.ativo).map(c=>`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <input type="checkbox" id="nai-${c.id}" style="width:16px;height:16px;">
        <label for="nai-${c.id}" style="flex:1;font-size:13.5px;">${c.nome}</label>
        <select id="nat-${c.id}" style="padding:5px 8px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:13px;">
          <option value="mensalista">Mensalista</option><option value="avulsa">Avulsa</option>
        </select>
      </div>`).join('')}
    <div class="modal-actions">
      <button class="btn btn-full" onclick="fecharModal(true)">Cancelar</button>
      <button class="btn btn-primary btn-full" onclick="salvarNovaAtleta()">Cadastrar</button>
    </div>
  `);
}

async function salvarNovaAtleta() {
  const nome = document.getElementById('na-nome').value.trim();
  if (!nome) { await vAlert('Informe o nome'); return; }
  const inscricoes = (todosCampeonatos||[]).filter(c=>c.ativo&&document.getElementById('nai-'+c.id)?.checked)
    .map(c=>({campeonato_id:c.id, tipo:document.getElementById('nat-'+c.id)?.value||'mensalista', data_entrada:new Date().toISOString().slice(0,10)}));
  const res = await api('atletas.php','POST',{nome, posicao:document.getElementById('na-pos').value, telefone:document.getElementById('na-tel').value, inscricoes});
  if (res?.ok) { fecharModal(true); carregarAtletas2(); }
  else await vAlert('Erro: '+(res?.erro||''));
}

// ── CAMPEONATOS ───────────────────────────────
async function carregarCampeonatos2() {
  const el = document.getElementById('camp2-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  todosCampeonatos = await api('campeonatos.php') || [];
  if (!todosCampeonatos.length) { el.innerHTML = '<p style="color:var(--gray-400);">Nenhum campeonato.</p>'; return; }
  el.innerHTML = `<div class="grid-3">
    ${todosCampeonatos.map(c=>`
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:4px;">🏆 ${c.nome}</div>
        <div style="font-size:12px;color:var(--gray-400);margin-bottom:10px;">${c.local_jogo||'—'}</div>
        <span class="badge ${c.ativo?'badge-green':'badge-gray'}">${c.ativo?'Ativo':'Inativo'}</span>
      </div>`).join('')}
  </div>`;
}

// ── INIT ──────────────────────────────────────
document.addEventListener('DOMContentLoaded', ()=>{
  gerarMeses('j2-mes');
  gerarMeses('fech2-mes');
  renderDash();
  // carrega campeonatos em background
  api('campeonatos.php').then(d=>{ if(d) todosCampeonatos=d; });
});
</script>
</body>
</html>
